# 131056 - João Dimitry
name: Checkstyle Parametros 131056

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  checks: write

jobs:
  checkstyle-parametros-131056:
    name: Checkstyle Parametros 131056
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Verificar nomes dos parâmetros
        uses: dbelyaev/action-checkstyle@v4.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-131056.xml
          reporter: github-pr-check
          level: error
          filter_mode: nofilter
          fail_level: any